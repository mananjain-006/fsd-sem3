<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Campus Help Desk</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <div>
                <h1>Campus Help Desk</h1>
                <p>Submit and manage your campus requests</p>
            </div>

            <div class="header-icon">
                🎓
            </div>
        </div>
    </header>

    <main class="container">

        <!-- Form Section -->
        <section class="form-card">

            <div class="section-title">
                <h2>Submit a Request</h2>
                <p>Tell us about the problem you're facing.</p>
            </div>

            <form id="requestForm">

                <div class="form-row">

                    <div class="form-group">
                        <label for="studentName">
                            Student Name
                        </label>

                        <input
                            type="text"
                            id="studentName"
                            placeholder="Enter your name"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="student@example.com"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="category">
                            Category
                        </label>

                        <select id="category" required>
                            <option value="">Choose category</option>
                            <option value="Technical">Technical</option>
                            <option value="Hostel">Hostel</option>
                            <option value="Library">Library</option>
                            <option value="Transport">Transport</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="priority">
                            Priority
                        </label>

                        <select id="priority" required>
                            <option value="">Choose priority</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                </div>

                <div class="form-group">
                    <label for="description">
                        Problem Description
                    </label>

                    <textarea
                        id="description"
                        placeholder="Describe your problem..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Submit Request
                </button>

            </form>

        </section>


        <!-- Requests Section -->
        <section class="requests-section">

            <div class="requests-heading">
                <div>
                    <h2>Submitted Requests</h2>
                    <p>Track all campus help desk requests.</p>
                </div>

                <span class="request-label">
                    All Requests
                </span>
            </div>

            <div id="requestsList"></div>

        </section>

    </main>

    <footer>
        <p>Campus Help Desk &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
